# Render Blueprint: static site (no server). Firebase is only called from the browser.
services:
  - type: web
    runtime: static # older Render schema uses: env: static
    name: hercules-fitness
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22" # quoted: env var values are strings
      # Values are entered in the Render dashboard (sync: false keeps them out of this file).
      # They are baked into the bundle at build time: changing one requires a redeploy.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    # Security response headers on every path. Deliberately NOT a full Content-Security-Policy: a strict
    # one needs testing against Firebase Auth/Firestore and MUI/emotion inline styles before it is added.
    # `frame-ancestors 'none'` on its own restricts nothing else. Syntax: render.com/docs/blueprint-spec#headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
    routes:
      # SPA fallback so deep links / refreshes on /members etc. serve the app.
      - type: rewrite
        source: /*
        destination: /index.html
